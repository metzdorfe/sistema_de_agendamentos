; Fest Agenda — conexão com o banco (único dado fora do banco).
; Tipo: Embarcado (padrão: o Firebird vai junto do sistema, não precisa instalar servidor)
;       ou Servidor (Firebird Server na rede; usa Servidor e Porta).
; Caminho: relativo à pasta do sistema (ex.: BD\basefestagenda.fdb) ou absoluto.
;          Com Tipo=Servidor numa outra máquina, use o caminho do arquivo naquela máquina.
[Banco]
Tipo=Embarcado
Servidor=localhost
Porta=3050
Caminho=BD\basefestagenda.fdb
Usuario=SYSDBA
Senha=masterkey
