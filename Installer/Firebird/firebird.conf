# ============================================================================
# Fest Agenda - Firebird 5 Embedded
# Este arquivo fica na pasta do sistema, junto do fbclient.dll. O Firebird
# embarcado roda dentro do processo do Fest Agenda: não há servidor instalado.
# Os demais parâmetros usam os valores padrão do Firebird 5.
# ============================================================================

# SuperServer: o banco é aberto com exclusividade pelo Fest Agenda enquanto ele
# estiver aberto (por isso os utilitários pedem para fechar o sistema antes).
ServerMode = Super

# Caminho sem servidor (BD\basefestagenda.fdb) abre direto no embarcado (Engine13), mesmo que exista
# um Firebird Server rodando na máquina. "servidor:caminho" (config.ini com Tipo=Servidor) usa o Remote.
Providers = Engine13, Remote
